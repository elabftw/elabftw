# elabftw nginx configuration file
# https://github.com/elabftw/elabftw
# values between "%" are replaced by prepare.sh script at container launch
daemon off;
worker_processes %WORKER_PROCESSES%;

events {
    worker_connections  1024;
}

http {
    include mime.types;
    server_tokens off;
    default_type application/octet-stream;
    sendfile on;
    # by default nginx will not allow them, but they are valid and useful in some contexts (OIDC)
    underscores_in_headers on;
    # timeouts
    # see CIS benchmark nginx 2.4.4
    client_body_timeout   10s;
    client_header_timeout 10s;
    send_timeout          10s;
    keepalive_timeout %KEEPALIVE_TIMEOUT%;
    client_max_body_size %CLIENT_MAX_BODY_SIZE%;
    client_body_buffer_size 1m;
    # Coarse source-IP protection for the authentication endpoint.
    # $binary_remote_addr honors nginx real_ip configuration when enabled.
    limit_req_zone $binary_remote_addr zone=login_per_ip:10m rate=5r/s;

    log_format elabftw escape=json
    '{'
        '"time":"$time_iso8601",'
        '"request_id":"$request_id",'
        '"remote_addr":"$remote_addr",'
        '"x_forwarded_for":"$http_x_forwarded_for",'
        '"x_forwarded_proto":"$http_x_forwarded_proto",'
        '"connection":$connection,'
        '"connection_requests":$connection_requests,'
        '"host":"$host",'
        '"scheme":"$scheme",'
        '"request_method":"$request_method",'
        '"request_uri":"$request_uri",'
        '"server_protocol":"$server_protocol",'
        '"status":$status,'
        '"request_length":$request_length,'
        '"bytes_sent":$bytes_sent,'
        '"body_bytes_sent":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"request_completion":"$request_completion",'
        '"upstream_addr":"$upstream_addr",'
        '"upstream_status":"$upstream_status",'
        '"upstream_connect_time":"$upstream_connect_time",'
        '"upstream_header_time":"$upstream_header_time",'
        '"upstream_response_time":"$upstream_response_time",'
        '"upstream_response_length":"$upstream_response_length",'
        '"brotli_ratio":"$brotli_ratio",'
        '"http_referer":"$http_referer",'
        '"http_user_agent":"$http_user_agent",'
        '"ssl_protocol":"$ssl_protocol",'
        '"ssl_cipher":"$ssl_cipher"'
    '}';

    access_log /dev/stdout elabftw;
    include /run/nginx/conf.d/*.conf;
}
