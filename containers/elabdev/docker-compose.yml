  # PHPMYADMIN
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    restart: always
    container_name: phpmyadmin
    links:
        - mysql:db
    ports:
        - "8082:80"
    networks:
        - elabftw-net

  # SWAGGER UI
  # swagger allows you to consult the documentation generated by apidoc/v2/openapi.yaml
  # running a local container is perfect to see the changes right after a change
  swagger:
    image: swaggerapi/swagger-ui:v5.31.2
    restart: always
    container_name: swagger-elab-local
    ports:
      - "8085:8080"
    volumes:
      - ../../apidoc/v2:/usr/share/nginx/html/swagger:ro
    environment:
      - API_URL=swagger/openapi.yaml
    networks:
        - elabftw-net


