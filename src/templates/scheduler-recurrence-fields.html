<div class='scheduler-recurrence-fields mt-3'>
  <div class='form-check'>
    <input class='form-check-input scheduler-recurrence-enabled' type='checkbox' id='schedulerRecurrenceEnabled'>
    <label class='form-check-label font-weight-bold' for='schedulerRecurrenceEnabled'>{{ 'Repeat'|trans }}</label>
  </div>
  <div class='scheduler-recurrence-options d-none mt-3'>
    <div class='form-row align-items-center'>
      <label class='col-auto mb-0' for='schedulerRecurrenceInterval'>{{ 'Every'|trans }}</label>
      <div class='col-2'>
        <input id='schedulerRecurrenceInterval' class='form-control scheduler-recurrence-interval' type='number' min='1' max='365' value='1' required aria-label='{{ 'Recurrence interval'|trans }}'>
      </div>
      <div class='col-md-4'>
        <select id='schedulerRecurrenceFrequency' class='form-control scheduler-recurrence-frequency' aria-label='{{ 'Recurrence frequency'|trans }}'>
          <option value='daily'>{{ 'day(s)'|trans }}</option>
          <option value='weekly'>{{ 'week(s)'|trans }}</option>
          <option value='monthly'>{{ 'month(s)'|trans }}</option>
        </select>
      </div>
    </div>
    <div class='form-row align-items-center mt-2'>
      <label class='col-auto mb-0' for='schedulerRecurrenceCount'>{{ 'Ends after'|trans }}</label>
      <div class='col-2'>
        <input id='schedulerRecurrenceCount' class='form-control scheduler-recurrence-count' type='number' min='1' max='100' value='10' required aria-label='{{ 'Number of occurrences'|trans }}'>
      </div>
      <span class='col-auto'>{{ 'occurrences'|trans }}</span>
    </div>
    <small class='form-text text-muted'>{{ 'A recurring reservation is limited to 100 occurrences and 10 years.'|trans }}</small>
  </div>
</div>
