{# select an attachment of the entry to load in an editor (chemical editor, image editor), see load-attachment.ts #}
<div class='modal fade' id='loadAttachmentModal' tabindex='-1' role='dialog' aria-labelledby='loadAttachmentModalLabel'>
  <div class='modal-dialog' role='document'>
    <form class='modal-content' id='loadAttachmentForm' data-endpoint='{{ Entity.entityType.value }}/{{ Entity.id }}/uploads'>
      <div class='modal-header'>
        <h5 class='modal-title' id='loadAttachmentModalLabel'>{{ 'Load attachment'|trans }}</h5>
        <button type='button' class='close' data-dismiss='modal' aria-label='{{ 'Close'|trans }}'><span aria-hidden='true'>&times;</span></button>
      </div>
      <div class='modal-body'>
        <div class='form-group'>
          <label for='loadAttachmentSelect'>{{ 'Attachment'|trans }}</label>
          <select class='form-control' id='loadAttachmentSelect' name='attachment' required data-cy='load-attachment-select'></select>
        </div>
        <p id='loadAttachmentLoading' role='status'>{{ 'Loading...'|trans }}</p>
        <p id='loadAttachmentEmpty' role='status' hidden>{{ 'No compatible attachments found.'|trans }}</p>
        <p class='text-muted'>{{ 'Loading an attachment replaces the current drawing.'|trans }}</p>
        <p class='alert alert-danger' id='loadAttachmentError' role='alert' hidden></p>
      </div>
      <div class='modal-footer'>
        <button type='button' class='btn btn-secondary' data-dismiss='modal'>{{ 'Cancel'|trans }}</button>
        <button type='submit' class='btn btn-primary' data-cy='load-attachment-submit' disabled>{{ 'Load'|trans }}</button>
      </div>
    </form>
  </div>
</div>
