name: Release OpenAPI asset
on:
  release:
    types: [published]

jobs:
  upload-openapi:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Upload asset
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v2
        with:
          files: apidoc/v2/openapi.yaml

      - name: Trigger elabapi-go release
        env:
          GH_TOKEN: ${{ secrets.ELABAPI_GO_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh workflow run release.yml -R elabftw/elabapi-go -f version="$TAG"

