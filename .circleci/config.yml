# circle ci config for elabftw
# https://www.elabftw.net
version: 2.1
# code coverage orb
orbs:
  codecov: codecov/codecov@6.0.0
# split the jobs to run back_end tests and front e2e tests after db setup
executors:
  elab-executor:
    # The following configuration line tells CircleCI to use the specified docker image as the runtime environment for you job.
    # For more information on choosing an image (or alternatively using a
    # VM instead of a container) see https://circleci.com/docs/2.0/executor-types/
    # To see the list of pre-built images that CircleCI provides for most common languages see
    # https://circleci.com/docs/2.0/circleci-images/
    docker:
      - image: cimg/base:current
    resource_class: large
    environment:
      DOCKER_BUILDKIT: 1
      BUILDKIT_PROGRESS: plain
      COMPOSE_DOCKER_CLI_BUILD: 1

# See https://circleci.com/docs/reusing-config/#authoring-reusable-commands
commands:

  populate_db:
    description: Populate the database
    steps:
      - run:
          name: Populate the database
          command: |
            docker exec elabtmp bin/init db:populate src/tools/populate-config.yml.dist -y --fast

  build_image:
    steps:
      - run:
          name: Build image
          # we use the SHA1 as build tag to make sure we don't use stale images in the build cascade
          command: |
            docker build \
              -t "elabftw/elabimg:ci-${CIRCLE_SHA1}" \
              --build-arg CI=1 \
              -f containers/elabimg/Dockerfile .
            docker build \
              -t "elabftw/elabtmp:${CIRCLE_SHA1}" \
              --build-arg "ELABIMG_TAG=ci-${CIRCLE_SHA1}" \
              -f containers/elabtmp/Dockerfile .
            docker build \
              -t elabftw/circleci \
              --build-arg "ELABTMP_TAG=${CIRCLE_SHA1}" \
              -f containers/circleci/Dockerfile .

  load_image:
    steps:
      - run:
          name: Load image
          command: docker image load -i /tmp/elabftw-circleci.tar

  start_container:
    steps:
      - run:
          name: Start container
          command: docker compose -f containers/circleci/docker-compose.yml up -d --no-build --wait --wait-timeout 120

  start_mysql:
    steps:
      - run:
          name: Start mysql container
          command: docker compose -f containers/mysqltmp/docker-compose.yml up -d --wait --wait-timeout 120

  start_cypress:
    steps:
      - run:
          name: Start cypress container
          command: docker compose -f containers/cypress/docker-compose.yml up -d --no-build

  copy_cypress_tests:
    steps:
      - run:
          name: Copy Cypress tests
          command: |
            docker cp cypress.config.ts elab-cypress:/home/node/cypress.config.ts
            docker cp tsconfig.json elab-cypress:/home/node/tsconfig.json
            docker cp tests/cypress/. elab-cypress:/home/node/tests/cypress/
            docker cp tests/_data/. elab-cypress:/home/node/tests/_data/
            tar -cf - web/*.php | docker exec -i -u root elab-cypress tar -C /home/node -xf -
            docker exec -u root elab-cypress chown -R node:node /home/node/tests

jobs:
  build_elabtmp_image:
    executor: elab-executor
    working_directory: ~/elabftw/elabftw
    steps:
      - checkout
      - setup_remote_docker:
          version: docker27
          docker_layer_caching: true
      - build_image
      - run:
          name: Export image
          command: docker image save -o /tmp/elabftw-circleci.tar elabftw/circleci
      - persist_to_workspace:
          root: /tmp
          paths:
            - elabftw-circleci.tar

  code_linters:
    executor: elab-executor
    parallelism: 6
    working_directory: ~/elabftw/elabftw
    steps:
      - checkout
      - setup_remote_docker:
          version: docker27
      - attach_workspace:
          at: /tmp
      - load_image
      - start_container
      - run:
          name: Run SCSS linter
          command: |
            if [ "$CIRCLE_NODE_INDEX" -eq "0" ]; then
              docker exec elabtmp yarn csslint
            fi
      - run:
          name: Run Javascript linter
          command: |
            if [ "$CIRCLE_NODE_INDEX" -eq "1" ]; then
              docker exec elabtmp yarn jslint
            fi
      - run:
          name: Run PHP-CS-Fixer
          command: |
            if [ "$CIRCLE_NODE_INDEX" -eq "2" ]; then
              docker exec elabtmp yarn phpcs-dry
            fi
      - run:
          name: Run Twig linter
          command: |
            if [ "$CIRCLE_NODE_INDEX" -eq "3" ]; then
              docker exec elabtmp yarn twigcs
            fi
      - run:
          name: Run PSALM
          command: |
            if [ "$CIRCLE_NODE_INDEX" -eq "4" ]; then
              docker exec elabtmp yarn psalm
            fi
      - run:
          name: Run PHPStan
          command: |
            if [ "$CIRCLE_NODE_INDEX" -eq "5" ]; then
              docker exec elabtmp yarn phpstan
            fi

  php_unit_tests:
    executor: elab-executor
    working_directory: ~/elabftw/elabftw
    steps:
      - checkout
      - setup_remote_docker:
          version: docker27
      - attach_workspace:
          at: /tmp
      - load_image
      - start_container
      - start_mysql
      - populate_db
      - run:
          name: Run API v2 tests
          command: docker exec elabtmp php vendor/bin/codecept run apiv2
      - run:
          name: Run unit tests with coverage
          command: |
            docker exec elabtmp php vendor/bin/codecept run unit \
              --coverage \
              --coverage-xml=coverage.xml \
              --coverage-html=coverage

            docker exec elabtmp test -f /elabftw/tests/_output/coverage.xml
            docker exec elabtmp \
              tar -C /elabftw/tests/_output -cf - coverage.xml coverage \
              | tar -xf -

            mv coverage coverage-html
      - store_artifacts:
          path: coverage-html
          destination: coverage-html
      - codecov/upload

  cypress_e2e_tests:
    parameters:
      browser:
        type: string
    executor: elab-executor
    parallelism: 8
    working_directory: ~/elabftw/elabftw
    steps:
      - checkout
      - setup_remote_docker:
          version: docker27
      - attach_workspace:
          at: /tmp
      - load_image
      - start_container
      - start_mysql
      - start_cypress
      - copy_cypress_tests
      - populate_db
      - run:
          name: Create folders
          command: mkdir -p cypress/{screenshots,videos} test_results

      - run:
          name: Run Cypress on << parameters.browser >>
          command: |
            SPECS=$(
              find tests/cypress/integration -type f \
                \( -name '*.cy.js' -o -name '*.cy.jsx' -o -name '*.cy.ts' -o -name '*.cy.tsx' \) \
                ! -name 'translations.cy.ts' \
                | sort \
                | circleci tests split --split-by=timings --timings-type=filename \
                | paste -sd, -
            )

            docker exec elab-cypress cypress run \
              --browser << parameters.browser >> \
              --spec "$SPECS" \
              --config baseUrl=https://elabtmp:8080 \
              --reporter cypress-circleci-reporter \
              --reporter-options 'resultsDir=/home/node/test_results/cypress,resultFileName=cypress-[hash]'

      - run:
          name: Extract Cypress test results
          command: docker cp elab-cypress:/home/node/test_results/. test_results
          when: always

      - store_test_results:
          path: test_results
          when: always

      - run:
          name: Extract cypress screenshots and videos in case it is enabled again to debug a faulty run
          command: |
            docker cp elab-cypress:/home/node/tests/cypress/screenshots/. cypress/screenshots
            docker cp elab-cypress:/home/node/tests/cypress/videos/. cypress/videos
          when: always

      - store_artifacts:
          path: cypress
          destination: cypress

  cypress_translation_tests:
    parameters:
      language:
        type: string
    executor: elab-executor
    working_directory: ~/elabftw/elabftw
    steps:
      - checkout
      - setup_remote_docker:
          version: docker27
      - attach_workspace:
          at: /tmp
      - load_image
      - start_container
      - start_mysql
      - start_cypress
      - copy_cypress_tests
      - populate_db
      - run:
          name: Create folders
          command: mkdir -p cypress/{screenshots,videos} test_results

      - run:
          name: Run Cypress translations for << parameters.language >>
          command: |
            docker exec elab-cypress cypress run \
              --browser chrome \
              --spec tests/cypress/integration/translations.cy.ts \
              --env translationLanguage=<< parameters.language >> \
              --config baseUrl=https://elabtmp:8080 \
              --reporter cypress-circleci-reporter \
              --reporter-options 'resultsDir=/home/node/test_results/cypress,resultFileName=cypress-[hash]'

      - run:
          name: Extract Cypress test results
          command: docker cp elab-cypress:/home/node/test_results/. test_results
          when: always

      - store_test_results:
          path: test_results
          when: always

      - run:
          name: Extract cypress screenshots and videos in case it is enabled again to debug a faulty run
          command: |
            docker cp elab-cypress:/home/node/tests/cypress/screenshots/. cypress/screenshots
            docker cp elab-cypress:/home/node/tests/cypress/videos/. cypress/videos
          when: always

      - store_artifacts:
          path: cypress
          destination: cypress
workflows:
  version: 2
  build_and_test:
    jobs:
      - build_elabtmp_image
      - code_linters:
          requires:
            - build_elabtmp_image
      - php_unit_tests:
          requires:
            - build_elabtmp_image
      - cypress_e2e_tests:
          requires:
            - build_elabtmp_image
          matrix:
            parameters:
              browser:
                - firefox
                - chrome
      - cypress_translation_tests:
          requires:
            - build_elabtmp_image
          matrix:
            parameters:
              language:
                - ca_ES
                - cs_CZ
                - de_DE
                - el_GR
                - en_GB
                - en_US
                - es_ES
                - et_EE
                - fi_FI
                - fr_FR
                - hr_HR
                - id_ID
                - it_IT
                - ja_JP
                - ko_KR
                - nl_BE
                - pl_PL
                - pt_BR
                - pt_PT
                - ru_RU
                - sk_SK
                - sl_SI
                - sv_SE
                - uk_UA
                - uz_UZ
                - zh_CN
                - zh_TW
