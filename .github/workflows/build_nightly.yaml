name: Build nightly elabimg

on:
  schedule:
    - cron: "42 01 * * *"

## GITHUB_TOKEN authentication
permissions:
  contents: read
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  buildandpush:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-22.04
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    name: Build and push ${{ matrix.platform }}
    steps:
      # https://github.com/CycodeLabs/cimon-action
      - name: Cimon supply chain attack protection
        uses: cycodelabs/cimon-action@25652cf478dc0de0822d850da16ea6284c9b0bc9 # v1.0.5
        with:
          prevent: true
          allowed-hosts: >
            auth.docker.io
            codeload.github.com
            dl-cdn.alpinelinux.org
            docker.io
            ghcr.io
            index.docker.io
            mirror.gcr.io
            nginx.org
            packagist.org
            pkg-containers.githubusercontent.com
            production.cloudflare.docker.com
            raw.githubusercontent.com
            registry.yarnpkg.com
            registry-1.docker.io
            repo.yarnpkg.com
            registry.npmjs.org
            *.sigstore.dev
            hooks.deltablot.dev

      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.1.0
        with:
          persist-credentials: false

      # https://github.com/marketplace/actions/docker-setup-buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      # https://github.com/docker/login-action#docker-hub
      - name: Login to Docker Hub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Set version string
        id: version
        run: echo "value=$(date -u +'%y%m%d')-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      # https://github.com/docker/build-push-action#multi-platform-image
      - name: Build nightly for ${{ matrix.platform }} and push to Docker Hub
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: push
        with:
          context: .
          file: containers/elabimg/Dockerfile
          platforms: ${{ matrix.platform }}
          # the scope parameter is necessary when doing multi arch builds or we'll always miss cache
          cache-from: type=gha,scope=${{ runner.os }}-${{ matrix.arch }}
          cache-to:   type=gha,mode=max,scope=${{ runner.os }}-${{ matrix.arch }}
          outputs: type=image,name=docker.io/elabftw/elabimg,push-by-digest=true,name-canonical=true,push=true
          sbom: true
          build-args: |
              ELABFTW_VERSION=${{ steps.version.outputs.value }}

      - name: Export image digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.push.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload image digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  finalize:
    runs-on: ubuntu-22.04
    needs: buildandpush
    steps:
      # https://github.com/CycodeLabs/cimon-action
      - name: Cimon supply chain attack protection
        uses: cycodelabs/cimon-action@25652cf478dc0de0822d850da16ea6284c9b0bc9 # v1.0.5
        with:
          prevent: true
          allowed-hosts: >
            auth.docker.io
            check.trivy.dev
            codeload.github.com
            docker.io
            get.trivy.dev
            ghcr.io
            index.docker.io
            mirror.gcr.io
            pkg-containers.githubusercontent.com
            production.cloudflare.docker.com
            production.cloudfront.docker.com
            raw.githubusercontent.com
            registry-1.docker.io
            *.sigstore.dev
            hooks.deltablot.dev

      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download image digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      # https://github.com/marketplace/actions/docker-setup-buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # https://github.com/docker/login-action#docker-hub
      - name: Login to Docker Hub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Create and push manifest list
        working-directory: /tmp/digests
        run: |
          set -euo pipefail

          retry_delays=(3 12 27 48 75)
          refs=()
          while IFS= read -r digest; do
            if [[ "$digest" =~ ^[a-fA-F0-9]{64}$ ]]; then
              refs+=("elabftw/elabimg@sha256:${digest}")
            fi
          done < <(find . -type f -exec basename {} \; | sort)

          if [ "${#refs[@]}" -eq 0 ]; then
            echo 'No image digests found.'
            exit 1
          fi

          for attempt in 1 2 3 4 5; do
            if docker buildx imagetools create \
              -t elabftw/elabimg:nightly \
              "${refs[@]}"; then
              break
            fi

            if [ "$attempt" -eq 5 ]; then
              echo "Failed to create manifest list after $attempt attempts."
              exit 1
            fi

            delay="${retry_delays[$((attempt - 1))]}"
            echo "Retrying manifest creation in ${delay}s..."
            sleep "$delay"
          done

      - name: Resolve manifest digest
        id: manifest
        run: |
          digest=$(docker buildx imagetools inspect docker.io/elabftw/elabimg:nightly | awk '/^Digest:/ { print $2; exit }')
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      # TRIVY scans vuln scan
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 #v0.36.0
        with:
          image-ref: elabftw/elabimg:nightly
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          # use only the vuln scanner to avoid OOM kill with secrets scanning
          #not working: scanners: 'vuln'
          severity: 'CRITICAL,HIGH'
