# use this to run cypress in a container with bind-mounted specs
networks:
    elabftw-net:
services:
  cypress:
    image: elab-cypress
    extra_hosts:
      - "elab.localhost:host-gateway"
    build:
      context: ../..
      dockerfile: ./containers/cypress/Dockerfile
    container_name: elab-cypress
    volumes:
      - ../../tests/cypress:/home/node/tests/cypress
    networks:
      - elabftw-net
