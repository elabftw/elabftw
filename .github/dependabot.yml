version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: monthly
      day: wednesday
      time: "06:12"
  - package-ecosystem: composer
    directory: "/"
    schedule:
      interval: monthly
      day: wednesday
      time: "06:12"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        applies-to: version-updates
        patterns:
          - "*"
open-pull-requests-limit: 10
cooldown:
    default-days: 12
    semver-major-days: 32
    semver-minor-days: 24
    semver-patch-days: 3
